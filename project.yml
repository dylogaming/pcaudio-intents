name: Intents
options: { deploymentTarget: { iOS: "17.0" } }
settings: { base: { SWIFT_VERSION: "5", CODE_SIGNING_ALLOWED: "NO", GENERATE_INFOPLIST_FILE: "YES" } }
targets:
  PCAudio:
    type: application
    platform: iOS
    sources: [App, ToggleIntent.swift]
    settings: { base: { PRODUCT_MODULE_NAME: PCAudio, PRODUCT_BUNDLE_IDENTIFIER: com.dylogaming.pcaudio } }
    dependencies: [{ target: PCAudioWidget }]
  PCAudioWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, ToggleIntent.swift]
    settings: { base: { PRODUCT_MODULE_NAME: PCAudioWidget, PRODUCT_BUNDLE_IDENTIFIER: com.dylogaming.pcaudio.widget, INFOPLIST_KEY_NSExtension: "", INFOPLIST_FILE: Widget-Info.plist, GENERATE_INFOPLIST_FILE: "NO" } }
